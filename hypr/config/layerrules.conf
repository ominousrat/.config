layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.9, match:namespace rofi

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar

decoration {
    # ... other settings ...
    blur {
        enabled = true
        size = 2        # Adjust for blur radius
        passes = 3      # Adjust for blur smoothness
        ignore_opacity = true
    }
}